[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rauldev-yoru/enishi"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.4.1"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "0.9"
toml_edit = "0.25"
data-encoding = "2"
subtle = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
enishi-proto = { path = "crates/enishi-proto" }
enishi-core = { path = "crates/enishi-core" }
enishi-svc = { path = "crates/enishi-svc" }
enishi-mcp = { path = "crates/enishi-mcp" }
