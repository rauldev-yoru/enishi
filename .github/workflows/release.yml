name: release
# Tag `vX.Y.Z` (matching the workspace version) → build release binaries, attach them with
# SHA256SUMS to a GitHub Release. Pre-release tags (`v0.1.0-rc.1`) make a pre-release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Oldest supported runner = oldest glibc the Linux binary needs.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: enishi
            asset: enishi-x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: enishi.exe
            asset: enishi-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Tag matches the crate version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "enishi") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match enishi $version"
            exit 1
          fi
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p enishi --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum enishi-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "enishi $TAG" \
            --generate-notes \
            --verify-tag \
            "${pre[@]}"
